replicaCount: 1

image:
  repository: kubetask/controller
  tag: v0.1.0
  pullPolicy: IfNotPresent

api:
  port: 8080
  host: "0.0.0.0"

metrics:
  port: 8081

config:
  logLevel: info
  logFormat: json

auth:
  enabled: false
  # Required when enabled; use the same audience when issuing caller tokens.
  audience: ""
  tenantIsolation: false
  apiKeys:
    existingSecret:
      name: ""
      key: keys.json

# URL is injected from an existing Secret; restart Pods after changing it.
webhook:
  enabled: false
  timeout: 5s
  maxRetries: 3
  existingSecret:
    name: ""
    key: url

smtp:
  enabled: false
  address: "" # host:port, usually 587 for STARTTLS or 465 for implicit TLS
  tls: starttls
  from: ""
  to: []
  timeout: 10s
  maxRetries: 3
  subjectTemplate: ""
  bodyTemplate: ""
  # Leave name empty when the SMTP relay accepts clients without SMTP AUTH.
  existingSecret:
    name: ""
    usernameKey: username
    passwordKey: password

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

ingress:
  enabled: false
  className: ""
  host: kubetask.local

serviceAccount:
  # With an existing account, grant the controller and review permissions separately.
  create: true
  name: ""

service:
  type: ClusterIP
  port: 8080

{{- $authAudience := trim .Values.auth.audience -}}
{{- if .Values.auth.enabled -}}
{{- $authAudience = required "auth.audience is required when auth.enabled is true" $authAudience -}}
{{- end -}}
{{- if and .Values.auth.tenantIsolation (not .Values.auth.enabled) -}}
{{- fail "auth.tenantIsolation requires auth.enabled" -}}
{{- end -}}
{{- if and .Values.auth.apiKeys.existingSecret.name (not .Values.auth.enabled) -}}
{{- fail "auth.apiKeys.existingSecret.name requires auth.enabled" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubetask.fullname" . }}-config
  labels:
    {{- include "kubetask.labels" . | nindent 4 }}
data:
  config.yaml: |
    log-level: {{ .Values.config.logLevel }}
    log-format: {{ .Values.config.logFormat }}
    api-port: {{ .Values.api.port }}
    api-host: {{ .Values.api.host }}
    auth-enabled: {{ .Values.auth.enabled }}
    auth-audience: {{ $authAudience | quote }}
    tenant-isolation-enabled: {{ .Values.auth.tenantIsolation }}
    {{- if .Values.auth.apiKeys.existingSecret.name }}
    auth-api-keys-file: "/etc/kubetask-keys/keys.json"
    {{- end }}
    webhook-enabled: {{ .Values.webhook.enabled }}
    webhook-timeout: {{ .Values.webhook.timeout | quote }}
    webhook-max-retries: {{ .Values.webhook.maxRetries }}
    smtp-enabled: {{ .Values.smtp.enabled }}
    smtp-address: {{ .Values.smtp.address | quote }}
    smtp-tls: {{ .Values.smtp.tls | quote }}
    smtp-from: {{ .Values.smtp.from | quote }}
    smtp-to: {{ .Values.smtp.to | toJson }}
    smtp-timeout: {{ .Values.smtp.timeout | quote }}
    smtp-max-retries: {{ .Values.smtp.maxRetries }}
    smtp-subject-template: {{ .Values.smtp.subjectTemplate | quote }}
    smtp-body-template: {{ .Values.smtp.bodyTemplate | quote }}

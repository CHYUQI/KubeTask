---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kubetask.kubetask.io
  resources:
  - tasks
  - workflows
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kubetask.kubetask.io
  resources:
  - tasks/finalizers
  - workflows/finalizers
  verbs:
  - update
- apiGroups:
  - kubetask.kubetask.io
  resources:
  - tasks/status
  - workflows/status
  verbs:
  - get
  - patch
  - update
